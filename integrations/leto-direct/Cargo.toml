[workspace]

[package]
name = "electra-leto-direct"
default-run = "qualify"
version = "0.5.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ryancinsight/electra"
publish = false
description = "Bounded Leto direct factorization for Electra DC qualification"

[dependencies]
electra-circuit = { path = "../../crates/electra-circuit" }
electra-ac = { path = "../../crates/electra-ac" }
leto = { version = "=0.52.0", default-features = false }
leto-ops = { version = "=0.52.0", default-features = false }
