[package]
name = "electra-metis-probe"
version = "0.7.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[dependencies]
electra-circuit = {path="../../crates/electra-circuit"}
iris = { package = "iris-viz", git = "https://github.com/ryancinsight/iris.git", rev = "7f378a654cb06fa22e4863e97db26b8f57d238c3", default-features = false }
electra-schematic = { path = "../../crates/electra-schematic" }
metis-core = { git = "https://github.com/ryancinsight/metis.git", rev = "b20399c1a2888b5c404ac05d8dd9851fe4412d7e" }

[target.'cfg(windows)'.dependencies]
metis-platform = { git = "https://github.com/ryancinsight/metis.git", rev = "b20399c1a2888b5c404ac05d8dd9851fe4412d7e" }

[dependencies.electra-iris-ac]
path = "../iris-ac"

[dependencies.electra-ac]
path = "../../crates/electra-ac"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[dependencies.electra-board]
path = "../../crates/electra-board"

[dependencies.electra-board-field]
path = "../../crates/electra-board-field"
