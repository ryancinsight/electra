[package]
name = "electra-iris-ac"
version = "0.5.15"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[dependencies]
electra-ac = { path = "../../crates/electra-ac" }
electra-schematic = { path = "../../crates/electra-schematic" }
iris = { package = "iris-viz", version = "=0.1.4", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
