[package]
name = "electra-iris-ac"
version = "0.6.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[dependencies]
electra-ac = { path = "../../crates/electra-ac" }
electra-schematic = { path = "../../crates/electra-schematic" }
iris = { package = "iris-viz", git = "https://github.com/ryancinsight/iris.git", rev = "7f378a654cb06fa22e4863e97db26b8f57d238c3", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
