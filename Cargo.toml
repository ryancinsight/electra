[workspace]
members = ["crates/electra-network", "crates/electra-circuit", "crates/electra-ac", "crates/electra-schematic"]
default-members = ["crates/electra-network", "crates/electra-circuit"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ryancinsight/electra"

[workspace.dependencies]
athena-core = { version = "0.4.0", default-features = false }
aequitas = { version = "0.5.0", default-features = false }
eunomia = { version = "0.12.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
