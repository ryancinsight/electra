[workspace]
members = ["crates/electra-network", "crates/electra-circuit"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ryancinsight/electra"

[workspace.dependencies]
aequitas = { version = "0.5.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
